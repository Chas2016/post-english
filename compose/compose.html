<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>写 X 帖文</title>
  <link rel="stylesheet" href="compose.css">
  <script src="compose.js" defer></script>
</head>
<body>
  <main class="composer">
    <header class="page-header">
      <div>
        <h1>写 X 帖文</h1>
        <p>把中文草稿写成自然、简洁的英文短帖。</p>
      </div>
      <a class="settings-link" href="../options/options.html" target="_blank" rel="noopener">插件设置 <span aria-hidden="true">↗</span></a>
    </header>

    <form class="workspace" id="workspace">
      <section class="editor source">
        <label for="source-text">中文草稿</label>
        <textarea id="source-text" maxlength="3000" placeholder="想分享什么？" lang="zh-CN"></textarea>
        <div class="actions">
          <button class="primary" id="generate" type="submit" disabled>生成英文帖</button>
          <kbd id="shortcut" title="生成英文帖" aria-hidden="true">Ctrl + Enter</kbd>
        </div>
      </section>

      <section class="editor">
        <div class="editor-heading">
          <label for="post-text">英文帖文</label>
          <span class="count" id="post-count" title="普通帖文的加权字符数估算">约 0 / 280</span>
        </div>
        <textarea id="post-text" placeholder="生成的帖文会出现在这里，可以直接编辑。" lang="en" spellcheck="true" aria-describedby="post-count"></textarea>
        <div class="actions result-actions">
          <button class="secondary" id="copy" type="button" disabled>复制</button>
          <button class="primary" id="open-x" type="button" disabled>在 X 中预填 <span aria-hidden="true">↗</span></button>
        </div>
      </section>
    </form>

    <div class="feedback">
      <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
      <a class="settings-link" id="configure" href="../options/options.html" target="_blank" rel="noopener" hidden>配置翻译服务 ↗</a>
    </div>
    <p class="usage" id="usage" hidden></p>
  </main>
</body>
</html>
